[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thehumanbox-lab"
version = "0.1.0"
description = "Python lab workspace for model experiments, evals, and tooling for The Human Box."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
thb-lab = "thehumanbox_lab.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff==0.16.6",
]
trace = [
  "websockets>=12.0",
  "msgpack>=1.0",
]
train = [
  "accelerate>=0.33",
  "datasets>=2.20",
  "peft>=0.12",
  "safetensors>=0.4",
  "transformers>=4.44",
]
inference = [
  "llama-cpp-python>=0.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
